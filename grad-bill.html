<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { margin: 0; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
        .el-container { height: 100vh; }
        .el-aside { background: #001529; }
        .el-menu { border-right: none; }
        .sidebar-title { color: #fff; text-align: center; padding: 20px 0; font-size: 16px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .el-main { background: #f0f2f5; padding: 16px; }
        .el-table th { background: #fafafa !important; }
        .wl-filter-form .el-form-item { margin-bottom: 8px; margin-right: 12px; }
        .wl-table .el-table__footer-wrapper td { background: #fff7e6 !important; color: #fa8c16; font-weight: 600; }
        .wl-table .el-table__footer-wrapper td .cell { font-weight: 600; }
    </style>
</head>
<body>
<div id="app">
    <el-container>
        <el-aside width="220px">
            <div class="sidebar-title">🎓 导师服务账单</div>
            <el-menu default-active="grad-bill" background-color="#001529" text-color="rgba(255,255,255,0.65)" active-text-color="#fff">
                <el-menu-item index="grad-bill">
                    <i class="el-icon-s-claim"></i>
                    <span>导师服务账单</span>
                </el-menu-item>
            </el-menu>
        </el-aside>

        <el-container>
            <el-header style="background:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
                <el-breadcrumb separator="/">
                    <el-breadcrumb-item>首页</el-breadcrumb-item>
                    <el-breadcrumb-item>资金管理</el-breadcrumb-item>
                    <el-breadcrumb-item>导师服务账单</el-breadcrumb-item>
                </el-breadcrumb>
                <div>
                    <el-avatar size="small" style="background:#1890ff;">财</el-avatar>
                    <span style="margin-left:8px;font-size:14px;">财务专员</span>
                </div>
            </el-header>

            <el-main>
                <el-card>
                    <div slot="header" style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-weight:600;">导师服务账单</span>
                        <el-button size="small" icon="el-icon-download" @click="$message.success('导出Excel')">导出</el-button>
                    </div>
                    <!-- 筛选条件 -->
                    <el-form :inline="true" size="small" label-width="75px" class="wl-filter-form" style="margin-bottom:8px;">
                        <el-form-item label="结算状态">
                            <el-select v-model="filterStatus" placeholder="全部" clearable style="width:120px;">
                                <el-option label="待结算" value="待结算"></el-option>
                                <el-option label="结算中" value="结算中"></el-option>
                                <el-option label="已结算" value="已结算"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="项目名称">
                            <el-select v-model="filterCourseName" placeholder="全部" clearable style="width:180px;">
                                <el-option label="朝阳计划4.0-初阶" value="朝阳计划4.0-初阶"></el-option>
                                <el-option label="朝阳计划4.0-中阶" value="朝阳计划4.0-中阶"></el-option>
                                <el-option label="朝阳计划4.0-高阶" value="朝阳计划4.0-高阶"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="完成时间">
                            <el-date-picker v-model="filterDateRange" type="datetimerange" range-separator="至" start-placeholder="开始时间" end-placeholder="结束时间" style="width:360px;" value-format="yyyy-MM-dd HH:mm:ss"></el-date-picker>
                        </el-form-item>
                        <el-form-item label="关键字">
                            <el-input v-model="filterKeyword" placeholder="导师名称" prefix-icon="el-icon-search" style="width:240px;" clearable></el-input>
                        </el-form-item>
                        <el-form-item label-width="0">
                            <el-button type="primary" icon="el-icon-search" @click="$message.info('查询')">查询</el-button>
                            <el-button icon="el-icon-refresh-left" @click="resetFilter">重置</el-button>
                        </el-form-item>
                    </el-form>
                    <el-table :data="filteredData" border stripe size="small" style="width:100%;" class="wl-table" :header-cell-style="{background:'#fafafa'}" show-summary :summary-method="getSummaries">
                        <el-table-column type="index" label="序号" width="55" fixed="left"></el-table-column>
                        <el-table-column prop="tutorName" label="老师姓名" width="100"></el-table-column>
                        <el-table-column prop="courseName" label="项目内容" min-width="160" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="stageType" label="导师服务" width="100">
                            <template slot-scope="scope">
                                <el-tag size="mini" type="primary">{{ scope.row.stageType }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="currentCourseName" label="期" min-width="160" show-overflow-tooltip></el-table-column>
                        <el-table-column label="完成时间" width="170">
                            <template slot-scope="scope">
                                {{ scope.row.serviceTime }}
                            </template>
                        </el-table-column>
                        <el-table-column label="服务日期" width="110">
                            <template slot-scope="scope">
                                {{ (scope.row.serviceTime || '').slice(0, 10) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="服务时间" width="200">
                            <template slot-scope="scope">
                                {{ (scope.row.serviceTime || '').slice(11) }} 至 {{ formatEndTime(scope.row.serviceTime).slice(11) }}
                            </template>
                        </el-table-column>
                        <el-table-column label="结算方式" width="100">
                            <template slot-scope="scope">
                                <span>按次数</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="settleAmount" width="140">
                            <template slot="header">
                                应结算金额
                                <el-tooltip content="初阶=50元，中阶=100元，高阶=150元" placement="top">

                                </el-tooltip>
                            </template>
                            <template slot-scope="scope">
                                <span style="color:#fa8c16;font-weight:600;">{{ scope.row.settleAmount }}</span>
                            </template>
                        </el-table-column>
                        <el-table-column prop="status" label="待结算状态" width="110" fixed="right">
                            <template slot-scope="scope">
                                <el-tag size="mini" :type="statusTag(scope.row.status)">{{ scope.row.status }}</el-tag>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>
            </el-main>
        </el-container>
    </el-container>
</div>

        filteredData() {
            let data = this.allData;
            if (this.filterStatus) data = data.filter(r => r.status === this.filterStatus);
            if (this.filterCourseName) data = data.filter(r => r.courseName === this.filterCourseName);
            if (this.filterDateRange && this.filterDateRange.length === 2) {
                const [s, e] = this.filterDateRange;
                data = data.filter(r => {
                    const d = r.serviceTime || '';
                    return d >= s && d <= e;
                });
            }
            if (this.filterKeyword) {
                const kw = this.filterKeyword.toLowerCase();
                data = data.filter(r => r.tutorName.toLowerCase().includes(kw));
            }
            return data;
        }
    },
    methods: {
        resetFilter() {
            this.filterStatus = '';
            this.filterCourseName = '';
            this.filterKeyword = '';
            this.filterDateRange = [];
        },
        formatEndTime(time) {
            if (!time) return '';
            var d = new Date(time.replace(/-/g, '/'));
            d.setMinutes(d.getMinutes() + 30);
            var pad = function(n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        },
        statusTag(status) {
            const map = { '待结算': 'info', '结算中': 'warning', '已结算': 'success' };
            return map[status] || 'info';
        },
        getSummaries({ columns, data }) {
            const sumProps = ['settleAmount'];
            return columns.map((col, idx) => {
                if (idx === 0) return '合计';
                if (idx === 1) return (data && data.length ? data.length + ' 条' : '');
                if (!sumProps.includes(col.property)) return '';
                let sum = 0, hasNum = false;
                (data || []).forEach(r => {
                    const v = parseFloat(String(r[col.property] || '').replace(/[¥,\s]/g, ''));
                    if (!isNaN(v)) { sum += v; hasNum = true; }
                });
                if (!hasNum) return '-';
                return '¥' + sum.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            });
        }
    }
});
</script>
